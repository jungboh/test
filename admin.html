<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 - 설문 링크 허브</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="sub-page admin-page">
  <div class="wrap">
    <div class="topbar">
      <a class="icon-btn" href="index.html" aria-label="뒤로">←</a>
      <h1>관리자</h1>
      <a class="icon-btn" href="index.html" aria-label="처음으로">🏠</a>
    </div>

    <div class="card admin-login" id="loginCard">
      <h2>관리자 로그인</h2>
      <p class="card-sub">비밀번호를 입력해 주세요.</p>
      <form id="loginForm">
        <div class="field">
          <label for="pwInput">비밀번호</label>
          <input type="password" id="pwInput" required />
        </div>
        <button class="submit-btn" type="submit">로그인</button>
      </form>
      <p class="msg" id="loginMsg"></p>
    </div>

    <div id="dashboard" style="display:none;">
      <div class="card">
        <h2>반별 등록 현황</h2>
        <p class="card-sub">학급별로 설문 링크를 등록한 학생 수입니다.</p>
        <div class="class-summary" id="classSummary"></div>
      </div>

      <div class="card">
        <h2>전체 등록 목록 <span class="badge-count" id="totalBadge">0건</span></h2>
        <p class="card-sub">각 설문의 참여 인원(참여하기 클릭 수)을 확인할 수 있습니다.</p>
        <div class="table-scroll">
          <table class="admin-table" id="entryTable">
            <thead>
              <tr>
                <th>학년</th><th>반</th><th>번호</th><th>이름</th>
                <th>설문 제목</th><th>링크</th><th>참여 인원</th><th>등록일</th><th>관리</th>
              </tr>
            </thead>
            <tbody id="entryBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="footer-link">
      <a href="index.html">← 처음으로</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./assets/supabase-config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById("loginForm");
    const loginMsg = document.getElementById("loginMsg");
    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");
    const classSummary = document.getElementById("classSummary");
    const entryBody = document.getElementById("entryBody");
    const totalBadge = document.getElementById("totalBadge");
    const ADMIN_PASSWORD_KEY = "samu_admin_password";
    const REFRESH_INTERVAL_MS = 5000;

    let adminPassword = "";
    let refreshTimer = null;
    let isRefreshing = false;
    let allRows = [];
    let selectedClassKey = "";

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
    }

    function rowClassKey(row) {
      return `${row.grade}|${row.class_name}`;
    }

    function sortRows(rows) {
      return [...rows].sort((a, b) =>
        String(a.grade).localeCompare(String(b.grade), "ko", { numeric: true }) ||
        String(a.class_name).localeCompare(String(b.class_name), "ko", { numeric: true }) ||
        String(a.student_number).localeCompare(String(b.student_number), "ko", { numeric: true })
      );
    }

    function render(rows) {
      allRows = sortRows(rows);
      const groups = new Map();
      allRows.forEach((r) => {
        const key = rowClassKey(r);
        if (!groups.has(key)) {
          groups.set(key, {
            label: `${r.grade}학년 ${r.class_name}반`,
            count: 0,
          });
        }
        groups.get(key).count += 1;
      });

      if (selectedClassKey && !groups.has(selectedClassKey)) selectedClassKey = "";

      classSummary.innerHTML = "";
      if (groups.size > 0) {
        const allChip = document.createElement("button");
        allChip.type = "button";
        allChip.className = `class-chip${selectedClassKey ? "" : " active"}`;
        allChip.dataset.classKey = "";
        allChip.setAttribute("aria-pressed", String(!selectedClassKey));
        allChip.innerHTML = `<div class="n">${allRows.length}명</div><div class="l">전체 보기</div>`;
        classSummary.appendChild(allChip);
      }

      [...groups.entries()].forEach(([key, group]) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = `class-chip${selectedClassKey === key ? " active" : ""}`;
        chip.dataset.classKey = key;
        chip.setAttribute("aria-pressed", String(selectedClassKey === key));
        chip.innerHTML = `<div class="n">${group.count}명</div><div class="l">${escapeHtml(group.label)}</div>`;
        classSummary.appendChild(chip);
      });
      if (groups.size === 0) {
        classSummary.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">등록된 학급이 없습니다.</div>`;
      }

      const visibleRows = selectedClassKey
        ? allRows.filter((row) => rowClassKey(row) === selectedClassKey)
        : allRows;

      totalBadge.textContent = selectedClassKey
        ? `${visibleRows.length}건 / 전체 ${allRows.length}건`
        : `${visibleRows.length}건`;
      entryBody.innerHTML = "";
      visibleRows.forEach((r) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(r.grade)}</td>
          <td>${escapeHtml(r.class_name)}</td>
          <td>${escapeHtml(r.student_number)}</td>
          <td>${escapeHtml(r.student_name)}</td>
          <td>${escapeHtml(r.survey_title)}</td>
          <td><a href="${escapeHtml(r.link)}" target="_blank" rel="noopener noreferrer">바로가기</a></td>
          <td>${r.click_count}</td>
          <td>${formatDate(r.created_at)}</td>
          <td><button type="button" class="delete-entry-btn" data-entry-id="${r.id}">삭제</button></td>
        `;
        entryBody.appendChild(tr);
      });
    }

    classSummary.addEventListener("click", (event) => {
      const chip = event.target.closest(".class-chip");
      if (!chip) return;

      const nextKey = chip.dataset.classKey || "";
      selectedClassKey = selectedClassKey === nextKey ? "" : nextKey;
      render(allRows);
    });

    entryBody.addEventListener("click", async (event) => {
      const button = event.target.closest(".delete-entry-btn");
      if (!button) return;

      const row = allRows.find((item) => String(item.id) === button.dataset.entryId);
      if (!row) return;

      const confirmed = window.confirm(
        `${row.grade}학년 ${row.class_name}반 ${row.student_number}번 ${row.student_name} 학생의 설문을 삭제할까요?\n삭제한 데이터는 복구할 수 없습니다.`
      );
      if (!confirmed) return;

      button.disabled = true;
      button.textContent = "삭제 중";
      const { data, error } = await supabase.rpc("delete_survey_link", {
        p_id: row.id,
        p_password: adminPassword,
      });

      if (error || data !== true) {
        window.alert("삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.");
        button.disabled = false;
        button.textContent = "삭제";
        return;
      }

      await refreshDashboard();
    });

    async function refreshDashboard({ showLoginError = false } = {}) {
      if (!adminPassword || isRefreshing) return false;

      isRefreshing = true;
      const { data, error } = await supabase.rpc("admin_dashboard", {
        p_password: adminPassword,
      });
      isRefreshing = false;

      if (error) {
        if (showLoginError) {
          loginMsg.textContent = "비밀번호가 올바르지 않습니다.";
          loginMsg.classList.add("error");
        }
        return false;
      }

      loginCard.style.display = "none";
      dashboard.style.display = "block";
      render(data || []);
      return true;
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        if (!document.hidden) refreshDashboard();
      }, REFRESH_INTERVAL_MS);
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && adminPassword) refreshDashboard();
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginMsg.textContent = "";
      loginMsg.className = "msg";

      adminPassword = document.getElementById("pwInput").value;
      const authenticated = await refreshDashboard({ showLoginError: true });

      if (!authenticated) {
        adminPassword = "";
        sessionStorage.removeItem(ADMIN_PASSWORD_KEY);
        return;
      }

      sessionStorage.setItem(ADMIN_PASSWORD_KEY, adminPassword);
      startAutoRefresh();
    });

    async function restoreAdminSession() {
      const savedPassword = sessionStorage.getItem(ADMIN_PASSWORD_KEY);
      if (!savedPassword) return;

      adminPassword = savedPassword;
      const authenticated = await refreshDashboard();
      if (authenticated) {
        startAutoRefresh();
      } else {
        adminPassword = "";
        sessionStorage.removeItem(ADMIN_PASSWORD_KEY);
      }
    }

    restoreAdminSession();
  </script>
</body>
</html>
